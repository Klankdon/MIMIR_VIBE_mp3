name: Build .NET App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore SimpleMp3Player/SimpleMp3Player.csproj

    - name: Build Solution
      run: dotnet build SimpleMp3Player/SimpleMp3Player.csproj --configuration Release --no-restore

    - name: Publish Executable
      run: dotnet publish SimpleMp3Player/SimpleMp3Player.csproj --configuration Release --self-contained true -r win-x64 -o ./publish --no-restore

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SimpleMp3Player-Exe
        path: ./publish/
